# CODEX_HOME/config.toml for every baseline conversation (copied into a fresh CODEX_HOME).
# Loaded with --strict-config, so an unknown or misspelled key aborts the run.

# Same condition as the other baselines: no web search.
web_search = "disabled"

[history]
persistence = "none"

[features]
# Nothing that reaches outside the trace: no ChatGPT connectors/plugins, browsers,
# desktop control, image generation, or memories from earlier sessions.
apps = false
plugins = false
remote_plugin = false
tool_suggest = false
skill_mcp_dependency_install = false
browser_use = false
browser_use_external = false
in_app_browser = false
computer_use = false
image_generation = false
memories = false
