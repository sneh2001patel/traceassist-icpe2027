User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
# Long model turns stream for minutes; don't cut idle-looking connections.
Timeout 3600
MaxClients 64
LogLevel Connect

# HTTPS tunnels only, and only to allow-listed hosts.
ConnectPort 443
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes
